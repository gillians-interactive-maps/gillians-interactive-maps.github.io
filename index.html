<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#080a0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="GTA: Liberty City Stories - 100% Interactive Radar & Collectibles Checklist." />
  <title>GTA: Liberty City Stories — 100% Radar Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- App CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Leaflet Map Canvas -->
  <div id="map"></div>

  <!-- Top Navigation HUD Bar -->
  <header class="top-nav">
    <div class="top-bar-row">
      <div class="brand-badge">
        <span class="logo-tag">GTA LCS</span>
        <span class="title">RADAR INTEL</span>
      </div>

      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="SEARCH #, DISTRICT, MISSION..." />
      </div>

      <div class="top-actions">
        <button id="btnOpenMenu" class="btn-icon" aria-label="Filters & Checklist" title="Tactical Intel & Checklist">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>

    <!-- Category Filter Chips Ribbon -->
    <div class="quick-chips-bar">
      <button class="chip-btn active" data-cat="all">
        <span>ALL</span>
      </button>
      <button class="chip-btn" data-cat="hidden_packages">
        <span>PACKAGES</span>
        <span class="count-badge" id="chipCount_hp">100</span>
      </button>
      <button class="chip-btn" data-cat="rampages">
        <span>RAMPAGES</span>
        <span class="count-badge">20</span>
      </button>
      <button class="chip-btn" data-cat="unique_stunt_jumps">
        <span>STUNTS</span>
        <span class="count-badge">26</span>
      </button>
      <button class="chip-btn" data-cat="races">
        <span>RACES</span>
        <span class="count-badge">9</span>
      </button>
      <button class="chip-btn" data-cat="challenges">
        <span>CHALLENGES</span>
        <span class="count-badge">11</span>
      </button>
    </div>
  </header>

  <!-- Floating Bottom Progress Widget (GTA LCS Health / Armor / Cash HUD style) -->
  <div class="floating-progress" id="progressWidget" title="View 100% Completion Briefing">
    <div class="progress-header-row">
      <div class="progress-info">
        <div class="label">PACKAGES FOUND</div>
        <div class="stats" id="hpProgressText">0 / 100</div>
      </div>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="hpProgressBar"></div>
    </div>
  </div>

  <!-- Island Controls (District Radar Selection) -->
  <nav class="island-controls" aria-label="Island Selection">
    <button class="island-btn active" data-island="all">ALL LC</button>
    <button class="island-btn" data-island="portland">PORTLAND</button>
    <button class="island-btn" data-island="staunton">STAUNTON</button>
    <button class="island-btn" data-island="shoreside">SHORESIDE</button>
  </nav>

  <!-- Bottom Sheet / Collectible Intel Dossier -->
  <div class="bottom-sheet-backdrop" id="sheetBackdrop"></div>
  <aside class="bottom-sheet" id="bottomSheet" aria-label="Collectible Details">
    <div class="sheet-hazard-stripe"></div>
    <div class="sheet-handle" id="sheetHandle"></div>

    <div class="sheet-header">
      <div class="sheet-titles">
        <span class="sheet-category-badge" id="sheetCategory">HIDDEN PACKAGES</span>
        <h2 class="sheet-title" id="sheetTitle">HIDDEN PACKAGE #1</h2>
        <span class="sheet-subtitle" id="sheetSubtitle">HARWOOD • PORTLAND</span>
      </div>
      <button class="sheet-close-btn" id="sheetCloseBtn" aria-label="Close">✕</button>
    </div>

    <!-- Objective & Specific Mission Unlocks -->
    <div class="info-box" id="sheetInfoBox"></div>

    <!-- Media Switcher (Image Tip shown first to save bandwidth) -->
    <div class="media-tabs" id="sheetMediaTabs">
      <button class="media-tab active" id="tabImage">
        <span>📷 PHOTO INTEL</span>
      </button>
      <button class="media-tab" id="tabVideo">
        <span>🎬 WATCH VIDEO</span>
      </button>
    </div>

    <!-- Media Box (Video only loaded on demand) -->
    <div class="sheet-media-box" id="sheetMediaBox"></div>

    <!-- Actions & Stepper -->
    <div class="sheet-actions">
      <button class="stepper-btn" id="btnPrev" title="Previous Package">◀</button>
      <button class="btn-collect" id="btnCollect">
        <span class="check-icon">○</span> MARK AS FOUND
      </button>
      <button class="stepper-btn" id="btnNext" title="Next Package">▶</button>
    </div>
  </aside>

  <!-- Side Filter & Pause Menu Statistics Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="filter-drawer" id="filterDrawer" aria-label="Settings and Categories">
    <div class="drawer-header">
      <h3 class="drawer-title">STATISTICS & INTEL</h3>
      <button class="sheet-close-btn" id="btnCloseDrawer" aria-label="Close drawer">✕</button>
    </div>

    <div class="drawer-content">
      <!-- Total Progress Card -->
      <div class="stats-card">
        <div>
          <div class="stats-card-title">100% COMPLETION</div>
          <div style="font-family: var(--font-gta-hud); font-size: 11px; color: var(--gta-text-dim); margin-top: 2px;" id="drawerSubStats">ALL COLLECTIBLES & MISSIONS</div>
        </div>
        <div class="stats-card-val" id="drawerStats">0 / 166</div>
      </div>

      <!-- Safehouse Weapon Milestone Tracker -->
      <div id="safehouseTrackerBox" style="display: flex; flex-direction: column; gap: 6px;">
        <div class="filter-section-title">SAFEHOUSE WEAPON REWARDS</div>
        <div class="info-box" id="safehouseMilestoneList"></div>
      </div>

      <!-- Display Options -->
      <div>
        <div class="filter-section-title">RADAR OPTIONS</div>
        <div class="filter-item">
          <div class="filter-item-name">HIDE FOUND ON RADAR</div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggleHideCollected" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- Category Checklist Toggles -->
      <div>
        <div class="filter-section-title">FILTER CATEGORIES</div>
        <div class="filter-list" id="drawerCategoryList"></div>
      </div>

      <!-- Backup & Reset -->
      <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 2px solid var(--gta-border);">
        <div class="filter-section-title">SAVE DATA MANAGEMENT</div>
        <button class="drawer-btn-secondary" id="btnExportProgress">💾 BACKUP PROGRESS (JSON)</button>
        <button class="drawer-btn-secondary" id="btnImportProgress">📂 RESTORE PROGRESS (JSON)</button>
        <button class="drawer-btn-secondary drawer-btn-danger" id="btnResetProgress">↺ RESET ALL PROGRESS</button>
      </div>
    </div>
  </aside>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Application JS -->
  <script src="js/app.js"></script>
</body>
</html>
