<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0d1015" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Minimalist GTA Liberty City Stories Interactive Map & Tracker for 100 Hidden Packages and Side Missions." />
  <title>GTA: Liberty City Stories Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- App CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Leaflet Map Canvas -->
  <div id="map"></div>

  <!-- Top Navigation Bar -->
  <header class="top-nav">
    <div class="top-bar-row">
      <div class="brand-badge">
        <span class="logo-tag">GTA LCS</span>
        <span class="title">Map Tracker</span>
      </div>

      <div class="search-wrapper">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search #, area, mission..." />
      </div>

      <div class="top-actions">
        <button id="btnOpenMenu" class="btn-icon" aria-label="Filters & Checklist" title="Menu">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
      </div>
    </div>

    <!-- Category Filter Chips -->
    <div class="quick-chips-bar">
      <button class="chip-btn active" data-cat="all">
        <span class="dot" style="background-color: #ffffff;"></span>
        <span>All</span>
      </button>
      <button class="chip-btn" data-cat="hidden_packages">
        <span class="dot" style="background-color: #e59400;"></span>
        <span>Packages</span>
        <span class="count-badge" id="chipCount_hp">100</span>
      </button>
      <button class="chip-btn" data-cat="rampages">
        <span class="dot" style="background-color: #c0392b;"></span>
        <span>Rampages</span>
        <span class="count-badge">20</span>
      </button>
      <button class="chip-btn" data-cat="unique_stunt_jumps">
        <span class="dot" style="background-color: #4a709c;"></span>
        <span>Stunts</span>
        <span class="count-badge">26</span>
      </button>
      <button class="chip-btn" data-cat="races">
        <span class="dot" style="background-color: #2e7d32;"></span>
        <span>Races</span>
        <span class="count-badge">9</span>
      </button>
      <button class="chip-btn" data-cat="challenges">
        <span class="dot" style="background-color: #8e44ad;"></span>
        <span>Challenges</span>
        <span class="count-badge">11</span>
      </button>
    </div>
  </header>

  <!-- Floating Bottom Progress Widget (Hidden Packages) -->
  <div class="floating-progress" id="progressWidget">
    <div class="progress-info">
      <span class="label">Packages Found</span>
      <span class="stats" id="hpProgressText">0 / 100</span>
    </div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="hpProgressBar"></div>
    </div>
  </div>

  <!-- Island Selector (Centered, accurate bounds) -->
  <nav class="island-controls" aria-label="Island Selection">
    <button class="island-btn active" data-island="all">All</button>
    <button class="island-btn" data-island="portland">Portland</button>
    <button class="island-btn" data-island="staunton">Staunton</button>
    <button class="island-btn" data-island="shoreside">Shoreside</button>
  </nav>

  <!-- Bottom Sheet / Details Modal -->
  <div class="bottom-sheet-backdrop" id="sheetBackdrop"></div>
  <aside class="bottom-sheet" id="bottomSheet" aria-label="Collectible Details">
    <div class="sheet-handle" id="sheetHandle"></div>

    <div class="sheet-header">
      <div class="sheet-titles">
        <span class="sheet-category-badge" id="sheetCategory">Hidden Packages</span>
        <h2 class="sheet-title" id="sheetTitle">Hidden Package #1</h2>
        <span class="sheet-subtitle" id="sheetSubtitle">Harwood • Portland</span>
      </div>
      <button class="sheet-close-btn" id="sheetCloseBtn" aria-label="Close">✕</button>
    </div>

    <!-- Objective & Specific Mission Unlocks -->
    <div class="info-box" id="sheetInfoBox"></div>

    <!-- Media Switcher (Image Tip shown first) -->
    <div class="media-tabs" id="sheetMediaTabs">
      <button class="media-tab active" id="tabImage">
        <span>Photo Tip</span>
      </button>
      <button class="media-tab" id="tabVideo">
        <span>Watch Video</span>
      </button>
    </div>

    <!-- Media Box (Video only loaded on click) -->
    <div class="sheet-media-box" id="sheetMediaBox"></div>

    <!-- Actions & Stepper -->
    <div class="sheet-actions">
      <button class="stepper-btn" id="btnPrev" title="Previous Package">◀</button>
      <button class="btn-collect" id="btnCollect">
        <span class="check-icon">○</span> Mark as Found
      </button>
      <button class="stepper-btn" id="btnNext" title="Next Package">▶</button>
    </div>
  </aside>

  <!-- Side Filter & Settings Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="filter-drawer" id="filterDrawer" aria-label="Settings and Categories">
    <div class="drawer-header">
      <h3 class="drawer-title">Checklist & Settings</h3>
      <button class="sheet-close-btn" id="btnCloseDrawer" aria-label="Close drawer">✕</button>
    </div>

    <div class="drawer-content">
      <!-- Total Progress Card -->
      <div class="stats-card">
        <div>
          <div class="stats-card-title">100% Completion Progress</div>
          <div style="font-size: 11px; color: var(--gta-text-dim); margin-top: 2px;" id="drawerSubStats">Packages & Side Missions</div>
        </div>
        <div class="stats-card-val" id="drawerStats">0 / 166</div>
      </div>

      <!-- Safehouse Weapon Milestone Tracker -->
      <div id="safehouseTrackerBox" style="display: flex; flex-direction: column; gap: 6px;">
        <div class="filter-section-title">Safehouse Weapon Rewards</div>
        <div class="info-box" id="safehouseMilestoneList" style="font-size: 11px;"></div>
      </div>

      <!-- Display Options -->
      <div>
        <div class="filter-section-title">Options</div>
        <div class="filter-item">
          <div class="filter-item-name">Hide Found Items</div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggleHideCollected" />
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <!-- Category Checklist Toggles -->
      <div>
        <div class="filter-section-title">Filter Categories</div>
        <div class="filter-list" id="drawerCategoryList"></div>
      </div>

      <!-- Backup & Reset -->
      <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--gta-border);">
        <div class="filter-section-title">Data Transfer</div>
        <button class="drawer-btn-secondary" id="btnExportProgress">Export Progress (JSON)</button>
        <button class="drawer-btn-secondary" id="btnImportProgress">Import Progress (JSON)</button>
        <button class="drawer-btn-secondary drawer-btn-danger" id="btnResetProgress">Reset All Progress</button>
      </div>
    </div>
  </aside>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Application JS -->
  <script src="js/app.js"></script>
</body>
</html>
