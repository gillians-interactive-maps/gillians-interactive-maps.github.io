<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Interactive map and tracker for GTA: Liberty City Stories 100 Hidden Packages and Side Activities." />
  <title>GTA: Liberty City Stories Map</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- App CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Leaflet Map Canvas -->
  <div id="map"></div>

  <!-- Slim Left Sidebar (Clean & Unobtrusive) -->
  <aside class="map-sidebar" aria-label="Category Navigation">
    <div class="sidebar-group">
      <!-- All Categories -->
      <button class="sidebar-btn active" data-cat="all" data-title="All Collectibles" aria-label="All Collectibles">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M4 4h7v7H4zm9 0h7v7h-7zm-9 9h7v7H4zm9 0h7v7h-7z"/>
        </svg>
      </button>

      <div class="sidebar-divider"></div>

      <!-- Hidden Packages -->
      <button class="sidebar-btn" data-cat="hidden_packages" data-title="Hidden Packages (100)" aria-label="Hidden Packages">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M20 7h-4V5c0-1.1-.9-2-2-2h-4c-1.1 0-2 .9-2 2v2H4c-1.1 0-2 .9-2 2v11c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V9c0-1.1-.9-2-2-2zM10 5h4v2h-4V5zm10 15H4V9h3v3h2V9h6v3h2V9h3v11z"/>
        </svg>
      </button>

      <!-- Rampages -->
      <button class="sidebar-btn" data-cat="rampages" data-title="Rampages (20)" aria-label="Rampages">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 2C7.58 2 4 5.58 4 10c0 2.7 1.34 5.08 3.4 6.53V19h2v2h2v-2h2v2h2v-2h2v-2.47c2.06-1.45 3.4-3.83 3.4-6.53 0-4.42-3.58-8-8-8zm-3 9.5c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zm6 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/>
        </svg>
      </button>

      <!-- Unique Stunt Jumps -->
      <button class="sidebar-btn" data-cat="unique_stunt_jumps" data-title="Unique Stunts (26)" aria-label="Unique Stunt Jumps">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M3 19h18v2H3v-2zm1.5-4L15 6.5V11h2V3h-8v2h4.5L5.5 13 4.5 15z"/>
        </svg>
      </button>

      <!-- Street & RC Races -->
      <button class="sidebar-btn" data-cat="races" data-title="Street Races (9)" aria-label="Races">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.22.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.85 7h10.29l1.04 3H5.81l1.04-3zM19 17H5v-4.66l.12-.34h13.77l.11.34V17z"/><circle cx="7.5" cy="14.5" r="1.5"/><circle cx="16.5" cy="14.5" r="1.5"/>
        </svg>
      </button>

      <!-- Side Challenges -->
      <button class="sidebar-btn" data-cat="challenges" data-title="Side Challenges (11)" aria-label="Challenges">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 2v3.08A7.002 7.002 0 0 0 5.08 12H2v2h3.08A7.002 7.002 0 0 0 12 18.92V22h2v-3.08A7.002 7.002 0 0 0 18.92 14H22v-2h-3.08A7.002 7.002 0 0 0 14 5.08V2h-2zm0 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 3a2 2 0 1 0 0 4 2 2 0 0 0 0-4z"/>
        </svg>
      </button>
    </div>

    <div class="sidebar-group">
      <!-- Hide Completed Toggle -->
      <button class="sidebar-btn" id="btnToggleHide" data-title="Hide Found Items" aria-label="Hide Found Items">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
        </svg>
      </button>

      <!-- Checklist & Settings Drawer -->
      <button class="sidebar-btn" id="btnOpenDrawer" data-title="Progress & Checklist" aria-label="Progress and Checklist">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
      </button>
    </div>
  </aside>

  <!-- Search Input Bar (Top Left) -->
  <div class="search-bar-wrap">
    <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
    <input type="text" id="searchInput" class="search-input" placeholder="Search collectible..." />
  </div>

  <!-- Island Quick-Jump Selector (Top Right) -->
  <nav class="island-bar" aria-label="Island Selection">
    <button class="island-btn active" data-island="all">All</button>
    <button class="island-btn" data-island="portland">Portland</button>
    <button class="island-btn" data-island="staunton">Staunton</button>
    <button class="island-btn" data-island="shoreside">Shoreside</button>
  </nav>

  <!-- Floating Progress Counter (Bottom Right) -->
  <div class="floating-progress" id="progressWidget" title="View Detailed Progress & Checklist">
    <span class="progress-title">Packages</span>
    <span class="progress-val" id="hpProgressText">0 / 100</span>
    <div class="progress-bar">
      <div class="progress-fill" id="hpProgressBar"></div>
    </div>
  </div>

  <!-- Clean Floating Detail Card (Desktop Top-Center / Mobile Bottom) -->
  <div class="detail-card" id="detailCard" aria-label="Collectible Details">
    <div class="card-header">
      <div class="card-title-box">
        <h2 class="card-title" id="cardTitle">Hidden Package #1</h2>
        <span class="card-subtitle" id="cardSubtitle">Harwood, Portland</span>
      </div>
      <button class="card-close-btn" id="cardCloseBtn" aria-label="Close">✕</button>
    </div>

    <!-- Media Box (Photo tip / Video) -->
    <div class="card-media-box" id="cardMediaBox"></div>

    <!-- Media Switcher (Only shown if video exists) -->
    <div class="media-toggle-bar" id="cardMediaTabs">
      <button class="media-toggle-btn active" id="tabImage">
        <span>Photo Tip</span>
      </button>
      <button class="media-toggle-btn" id="tabVideo">
        <span>Watch Video</span>
      </button>
    </div>

    <!-- Objective & Unlock Info -->
    <div class="card-info" id="cardInfo"></div>

    <!-- Actions Toolbar: Mark as Found Checkbox + Prev/Next -->
    <div class="card-actions">
      <button class="stepper-btn" id="btnPrev" title="Previous Package">◀</button>
      <button class="btn-mark-found" id="btnMarkFound">
        <span class="check-box-icon">☐</span> Hide this marker
      </button>
      <button class="stepper-btn" id="btnNext" title="Next Package">▶</button>
    </div>
  </div>

  <!-- Side Checklist & Progress Drawer -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="checklist-drawer" id="checklistDrawer" aria-label="Checklist and Progress">
    <div class="drawer-header">
      <h3 class="drawer-title">Checklist & Progress</h3>
      <button class="card-close-btn" id="btnCloseDrawer" aria-label="Close drawer">✕</button>
    </div>

    <div class="drawer-body">
      <!-- 100% Completion Stat Card -->
      <div class="stat-card">
        <div>
          <div class="stat-card-label">100% Completion</div>
          <div style="font-size: 11px; color: var(--text-dim); margin-top: 2px;" id="drawerSubStats">All Collectibles</div>
        </div>
        <div class="stat-card-val" id="drawerStats">0 / 166</div>
      </div>

      <!-- Safehouse Weapon Rewards -->
      <div>
        <div class="section-label">Safehouse Weapon Rewards</div>
        <div id="safehouseMilestoneList" style="display: flex; flex-direction: column; gap: 4px; background: #0f172a; padding: 8px 10px; border: 1px solid var(--panel-border); border-radius: 6px; font-size: 11px;"></div>
      </div>

      <!-- Map Display Options -->
      <div>
        <div class="section-label">Options</div>
        <div class="drawer-item">
          <label class="toggle-label" for="toggleHideCollected">
            <span>Hide found markers</span>
            <div class="toggle-switch">
              <input type="checkbox" id="toggleHideCollected" />
              <span class="toggle-slider"></span>
            </div>
          </label>
        </div>
      </div>

      <!-- Category Filter Toggles -->
      <div>
        <div class="section-label">Categories</div>
        <div id="drawerCategoryList" style="display: flex; flex-direction: column; gap: 4px;"></div>
      </div>

      <!-- Backup & Restore -->
      <div style="display: flex; flex-direction: column; gap: 6px; padding-top: 10px; border-top: 1px solid var(--panel-border);">
        <div class="section-label">Data Management</div>
        <button class="drawer-btn" id="btnExportProgress">Export Progress (JSON)</button>
        <button class="drawer-btn" id="btnImportProgress">Import Progress (JSON)</button>
        <button class="drawer-btn drawer-btn-danger" id="btnResetProgress">Reset All Progress</button>
      </div>
    </div>
  </aside>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Application JS -->
  <script src="js/app.js"></script>
</body>
</html>
